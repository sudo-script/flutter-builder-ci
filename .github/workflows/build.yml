name: Build React APK
on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Unique build identifier'
        required: true
        type: string
      branch:
        description: 'Branch containing the generated project'
        required: true
        type: string
      app_name:
        required: false
        default: 'My App'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      # ── CACHES ──────────────────────────────────────────────────
      # Runners are ephemeral, but Actions restores these into the
      # fresh VM at the start of each run. The first build populates
      # them (~6–9 min); later builds land around 3–5 min because npm
      # and Gradle dependencies come back from cache.

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/package.json', '**/capacitor.config.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web bundle
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Apply app icon, name, and version
        run: node scripts/apply-android-resources.mjs

      - name: Sync web assets into Android
        run: npx cap sync android

      - name: Assemble debug APK
        run: cd android && chmod +x ./gradlew && ./gradlew assembleDebug --no-daemon

      - name: List APK output
        run: find android/app/build/outputs -name '*.apk' | sort

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.build_id }}
          path: android/app/build/outputs/apk/debug/
          retention-days: 7
          if-no-files-found: error

      - name: Upload generated source on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: generated-src-${{ github.event.inputs.build_id }}
          path: src/
          retention-days: 3